server {
    listen 80;
    server_name localhost;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location /version {
        return 200 'name=echo-service
version=1.0.0
';
        add_header Content-Type text/plain;
    }

    location /echo {
        return 200 '{"service":"echo-service","message":"Echo response","headers":{"host":"$host","x-forwarded-for":"$http_x_forwarded_for"}}';
        add_header Content-Type application/json;
    }

    location / {
        return 200 'Echo Service Response
';
        add_header Content-Type text/plain;
    }
}
