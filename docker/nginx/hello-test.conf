server {
    listen 80;
    server_name localhost;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location /version {
        return 200 'name=hello-service
version=1.0.0
environment=test
instance=hello-test
';
        add_header Content-Type text/plain;
    }

    location /info {
        return 200 '{"service":"hello-service","environment":"test","instance":"hello-test"}';
        add_header Content-Type application/json;
    }

    location / {
        return 200 'Hello from TEST environment!
';
        add_header Content-Type text/plain;
    }
}
