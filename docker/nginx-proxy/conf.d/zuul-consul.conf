# =============================================================================
# Zuul Consul Gateway - Nginx Proxy Configuration
# =============================================================================
# This configuration demonstrates best practices for proxying to zuul-consul.
#
# Key features:
#   - Upstream with keepalive connections for better performance
#   - HTTP and HTTPS server blocks
#   - Proper X-Forwarded-* header propagation
#   - CORS support with preflight handling
#   - HSTS for HTTPS connections
#   - Health check endpoint
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream: Zuul Consul Gateway
# -----------------------------------------------------------------------------
# Using an upstream block allows for:
#   - Connection pooling with keepalive
#   - Easy addition of multiple backends for load balancing
#   - Health checks (nginx plus) or passive health monitoring
#
# For Docker: Use 'host.docker.internal' to reach the host machine
# For Linux without Docker Desktop: Use '172.17.0.1' or host network mode
# -----------------------------------------------------------------------------
upstream zuul_consul {
    server host.docker.internal:9091;

    # Maintain a pool of keepalive connections to the upstream
    # This significantly improves performance by reusing connections
    keepalive 32;

    # Optional: keepalive timeout (how long idle connections stay open)
    keepalive_timeout 60s;

    # Optional: limit requests per keepalive connection
    keepalive_requests 1000;
}

# -----------------------------------------------------------------------------
# HTTP Server (Port 80)
# -----------------------------------------------------------------------------
# Redirects all HTTP traffic to HTTPS for security.
# In development/testing, you may want to allow HTTP access.
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Health check endpoint (useful for load balancers)
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Option 1: Redirect all traffic to HTTPS (recommended for production)
    # return 301 https://$host$request_uri;

    # Option 2: Allow HTTP access (for development/testing)
    # Proxy to zuul-consul with all recommended headers
    location / {
        # --- Proxy Protocol Settings ---
        proxy_pass http://zuul_consul;

        # Use HTTP/1.1 for upstream connections (required for keepalive)
        proxy_http_version 1.1;

        # Clear the Connection header to enable keepalive
        proxy_set_header Connection "";

        # --- Request Headers ---
        # Pass the original Host header to the backend
        proxy_set_header Host $host;

        # Pass the real client IP address
        proxy_set_header X-Real-IP $remote_addr;

        # Append to X-Forwarded-For chain
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Indicate the original protocol (http)
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indicate SSL status (off for HTTP)
        proxy_set_header X-Forwarded-Ssl off;

        # Pass the original server port
        proxy_set_header X-Forwarded-Port $server_port;

        # --- Timeout Settings ---
        # Adjust these based on your backend response times
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # --- Buffering ---
        # Disable buffering for real-time/streaming responses
        proxy_buffering off;
    }
}

# -----------------------------------------------------------------------------
# HTTPS Server (Port 443)
# -----------------------------------------------------------------------------
# Secure server with TLS termination.
# Includes HSTS, CORS, and all recommended proxy settings.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    # -------------------------------------------------------------------------
    # SSL/TLS Configuration
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Modern TLS configuration (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL session caching for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (if using a real certificate)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /path/to/chain.pem;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    # HSTS: Tell browsers to always use HTTPS (max-age = 6 months)
    # Include 'includeSubDomains' and 'preload' for production
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy, but still useful)
    add_header X-XSS-Protection "1; mode=block" always;

    # -------------------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Main Proxy Location
    # -------------------------------------------------------------------------
    location / {
        # --- Proxy Protocol Settings ---
        proxy_pass http://zuul_consul;

        # Use HTTP/1.1 for upstream connections (required for keepalive)
        proxy_http_version 1.1;

        # Clear the Connection header to enable keepalive
        proxy_set_header Connection "";

        # --- Request Headers ---
        # Pass the original Host header to the backend
        proxy_set_header Host $host;

        # Pass the real client IP address
        proxy_set_header X-Real-IP $remote_addr;

        # Append to X-Forwarded-For chain
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Indicate the original protocol (https)
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indicate SSL status (on for HTTPS)
        proxy_set_header X-Forwarded-Ssl on;

        # Pass the original server port
        proxy_set_header X-Forwarded-Port $server_port;

        # --- Timeout Settings ---
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # For long-running requests (e.g., file uploads, streaming)
        # Increase these values as needed:
        # proxy_read_timeout 300s;

        # --- Buffering ---
        proxy_buffering off;

        # --- CORS Headers ---
        # These headers enable cross-origin requests from any origin.
        # For production, replace '*' with specific allowed origins.
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, X-Zuul-Consul-Id' always;
        add_header 'Access-Control-Max-Age' '86400' always;

        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin';
            add_header 'Access-Control-Max-Age' '86400';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' '0';
            return 204;
        }
    }
}

# -----------------------------------------------------------------------------
# Optional: Status/Metrics Endpoint
# -----------------------------------------------------------------------------
# Expose nginx status for monitoring (restrict to localhost/internal IPs)
# -----------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    # Allow only from localhost and Docker networks
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location = /nginx-status {
        stub_status on;
        access_log off;
    }

    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx-proxy"}\n';
        add_header Content-Type application/json;
    }
}
