# =============================================================================
# Nginx Configuration for Zuul Consul Gateway
# =============================================================================
# This is a reference configuration for running nginx as a reverse proxy
# in front of zuul-consul. It demonstrates best practices for:
#   - HTTP/1.1 upstream connections with keepalive
#   - Proper header forwarding (X-Forwarded-*, X-Real-IP)
#   - SSL/TLS termination with modern security settings
#   - HSTS (HTTP Strict Transport Security)
#   - Gzip compression
#   - CORS handling
#   - Connection timeouts and buffering
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Extended log format with timing information (useful for debugging)
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance Settings
    # -------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;

    # Keepalive settings for client connections
    keepalive_timeout  65;
    keepalive_requests 100;

    # Buffer sizes
    client_body_buffer_size     128k;
    client_max_body_size        100M;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 16k;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-javascript
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # Security Headers (applied globally, can be overridden per-location)
    # -------------------------------------------------------------------------
    # Hide nginx version
    server_tokens off;

    # -------------------------------------------------------------------------
    # Proxy Settings (defaults, can be overridden per-location)
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Buffering (disable for streaming/real-time APIs)
    proxy_buffering off;
    proxy_request_buffering off;

    # -------------------------------------------------------------------------
    # Include site configurations
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
