# Zuul Consul Gateway Configuration

# Server port (default: 9091 for HTTP, 8443 for HTTPS when SSL enabled)
zuul.server.port.main=9091

# Consul service refresh interval in minutes (default: 5)
# This is a fallback; health state watch provides near-real-time updates
zuul.consul.refresh.interval.minutes=5

# SSL Configuration (optional - enables HTTPS when cert path is set)
# Uses PEM format certificate and key files
# zuul.server.ssl.cert.path=/path/to/cert.pem
# zuul.server.ssl.key.path=/path/to/key.pem

# Connection pool settings
zuul.ribbon.ConnectTimeout=2000
zuul.ribbon.ReadTimeout=30000
zuul.ribbon.MaxAutoRetries=0
zuul.ribbon.MaxAutoRetriesNextServer=1
zuul.ribbon.OkToRetryOnAllOperations=true

# Disable Eureka discovery (using Consul instead)
eureka.client.enabled=false
eureka.registration.enabled=false

# Netty settings
zuul.max.outbound.zombie.connection.age=300000

# Request settings
zuul.request.body.max.size=25000000

# Filter settings
zuul.filters.packages=inbound,outbound

# Logging
zuul.debug.request=false
